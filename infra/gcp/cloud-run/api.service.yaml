apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: CLOUD_RUN_SERVICE
  namespace: PROJECT_ID
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cloudsql-instances: INSTANCE_CONNECTION_NAME
    spec:
      serviceAccountName: SERVICE_ACCOUNT
      containerConcurrency: 80
      containers:
        - image: IMAGE_URI
          ports: [{name: http1, containerPort: 8080}]
          env:
            - name: NEXTSTOCK_PROCESS_ROLE
              value: api
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              value: INSTANCE_CONNECTION_NAME
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: SECRET_NAME, key: DATABASE_URL}}
          startupProbe:
            httpGet: {path: /api/health/ready, port: 8080}
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 8080}
            periodSeconds: 30
          resources:
            limits: {cpu: "1", memory: 512Mi}
