<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Redefinir senha</title>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <form id="reset-form" autocomplete="off">
      <label>Nova senha <input name="password" type="password" minlength="12" required></label>
      <label>Confirme a senha <input name="confirmation" type="password" minlength="12" required></label>
      <button type="submit">Redefinir senha</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script type="module" src="/dist/reset-password.js"></script>
</body>
</html>
