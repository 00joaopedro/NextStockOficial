<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Redefinir senha</title>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <form id="reset-form" autocomplete="off">
      <p id="password-policy">A senha deve ter entre 6 e 128 caracteres e não conter caracteres de controle.</p>
      <label>Nova senha <input name="password" type="password" minlength="6" maxlength="128" required aria-describedby="password-policy"></label>
      <label>Confirme a senha <input name="confirmation" type="password" minlength="6" maxlength="128" required aria-describedby="password-policy"></label>
      <button type="submit">Redefinir senha</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script type="module" src="/dist/reset-password.js"></script>
</body>
</html>
