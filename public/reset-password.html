<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Redefinir senha</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #082f49; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #082f49; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px 16px; display: grid; place-items: center; overflow-x: hidden; color: #fff; background: linear-gradient(145deg, #082f49 0%, #0f766e 55%, #06b6d4 100%); }
    main { width: min(100%, 460px); padding: clamp(24px, 6vw, 40px); border-radius: 14px; background: linear-gradient(145deg, #166534 0%, #15803d 100%); box-shadow: 0 20px 50px rgba(2, 20, 35, 0.28); }
    h1 { margin: 0; color: #fff; font-size: clamp(1.65rem, 5vw, 2rem); line-height: 1.15; }
    .intro { margin: 12px 0 26px; color: #fff; line-height: 1.5; }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 8px; color: #fff; font-size: 0.95rem; font-weight: 700; }
    .password-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
    input { width: 100%; min-width: 0; min-height: 48px; padding: 12px 14px; border: 2px solid rgba(255, 255, 255, 0.76); border-radius: 8px; color: #102a43; background: #fff; font: inherit; outline: none; }
    input:focus-visible { border-color: #1e4f7a; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.58); }
    button { min-height: 48px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; transition: background-color 120ms ease, transform 120ms ease, opacity 120ms ease; }
    .password-toggle { min-width: 82px; padding: 10px 12px; border: 2px solid rgba(255, 255, 255, 0.72); color: #fff; background: #1e4f7a; }
    .password-toggle:hover { background: #1e4f7a; }
    .password-toggle:focus-visible, .submit-button:focus-visible { outline: 3px solid rgba(255, 255, 255, 0.9); outline-offset: 3px; }
    .password-toggle:active, .submit-button:active { transform: translateY(1px); }
    .submit-button { width: 100%; padding: 12px 16px; color: #fff; background: #1e4f7a; }
    .submit-button:hover { background: #173e61; }
    .submit-button:disabled { color: #fff; background: #496a83; cursor: not-allowed; }
    #message { min-height: 48px; margin: 4px 0 0; color: #fff; line-height: 1.45; }
    @media (max-width: 360px) { body { padding: 16px; } main { padding: 22px 18px; } .password-row { gap: 7px; } .password-toggle { min-width: 76px; padding-inline: 8px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Redefinir senha</h1>
    <p class="intro" id="password-policy">A senha deve ter entre 6 e 128 caracteres e não conter caracteres de controle.</p>
    <form id="reset-form" autocomplete="off">
      <label for="password">Nova senha</label>
      <div class="password-row">
        <input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required aria-describedby="password-policy">
        <button class="password-toggle" type="button" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="Mostrar nova senha">Mostrar</button>
      </div>
      <label for="confirmation">Confirme a senha</label>
      <div class="password-row">
        <input id="confirmation" name="confirmation" type="password" minlength="6" maxlength="128" autocomplete="new-password" required aria-describedby="password-policy">
        <button class="password-toggle" type="button" data-password-toggle aria-controls="confirmation" aria-pressed="false" aria-label="Mostrar confirmação da senha">Mostrar</button>
      </div>
      <button class="submit-button" type="submit">Redefinir senha</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/dist/reset-password.js"></script>
</body>
</html>
